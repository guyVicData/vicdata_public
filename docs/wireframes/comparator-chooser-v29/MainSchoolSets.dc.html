<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comparator schools — quick picks, school sets selected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#e9eaec}
.icon{display:block}
.row{display:flex;align-items:center;gap:12px;border:1px solid #e3e5e9;border-radius:10px;padding:12px 14px;background:#ffffff;text-align:left;width:100%;box-sizing:border-box;cursor:pointer}
.row.active{border-color:#2563eb;background:#eff6ff}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #c7cbd1;flex:0 0 20px;display:flex;align-items:center;justify-content:center}
.row.active .radio{border-color:#2563eb;background:#2563eb}
.badge{margin-left:auto;font-size:11px;color:#5b6470;background:#f1f3f5;border-radius:20px;padding:3px 9px;white-space:nowrap}
.row.active .badge{color:#2563eb;background:#dbeafe}
.btn{border:none;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:#141413;color:#fff}
.iconbtn{width:32px;height:32px;border-radius:50%;background:#f1f3f5;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 32px}
.sublist{margin:-2px 0 0 32px;padding:6px 10px;background:#f7f8f9;border-radius:8px;display:flex;flex-direction:column;gap:2px}
.subrow{display:flex;align-items:center;gap:10px;padding:7px 4px;cursor:pointer;border-radius:6px}
.subradio{width:16px;height:16px;border-radius:50%;border:1.5px solid #c7cbd1;flex:0 0 16px;background:#fff}
.subrow.active .subradio{border-color:#2563eb;background:#2563eb;box-shadow:inset 0 0 0 3px #fff}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; position: relative; background: #e9eaec; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <div style="position: absolute; inset: 12px; background: #ffffff; border-radius: 14px; box-shadow: 0 12px 32px rgba(20,20,19,0.18); display: flex; flex-direction: column; overflow: hidden">

    <div style="padding: 16px 18px; border-bottom: 1px solid #eef0f2; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto">
      <div>
        <div style="font-size: 17px; font-weight: 600; color: #141413; letter-spacing: -0.2px">Comparator schools</div>
        <div style="font-size: 12px; color: #767d87; margin-top: 2px">15 schools selected · The Chase</div>
      </div>
      <button class="iconbtn" aria-label="Close">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div style="flex: 1 1 auto; overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px">

      <div style="font-size: 11px; font-weight: 700; color: #9aa0a8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px">Start from — pick one</div>

      <button class="row">
        <div class="radio"></div>
        <div style="flex: 1 1 auto">
          <div style="font-size: 14px; font-weight: 600; color: #141413">10 nearest schools</div>
          <div style="font-size: 12px; color: #767d87; margin-top: 1px">Same sector, phase &amp; qualification · boarding matched where relevant</div>
        </div>
        <div style="flex: 0 0 auto; text-align: right">
          <div class="badge" style="margin-left: 0; display: inline-block">10 schools</div>
          <div style="font-size: 10.5px; color: #9aa0a8; margin-top: 4px; white-space: nowrap">Radius: up to 6.4km</div>
        </div>
      </button>

      <button class="row">
        <div class="radio"></div>
        <div style="flex: 1 1 auto">
          <div style="font-size: 14px; font-weight: 600; color: #141413">Schools in Surrey</div>
          <div style="font-size: 12px; color: #767d87; margin-top: 1px">Same LA &amp; phase, all qualifications &amp; mainstream sectors</div>
          <div style="font-size: 11px; color: #9aa0a8; margin-top: 1px">Includes FE &amp; sixth-form colleges</div>
        </div>
        <div style="flex: 0 0 auto; text-align: right">
          <div class="badge" style="margin-left: 0; display: inline-block">31 schools</div>
          <div style="font-size: 10.5px; color: #9aa0a8; margin-top: 4px; white-space: nowrap">Spans up to 22km</div>
        </div>
      </button>

      <button class="row">
        <div class="radio"></div>
        <div style="flex: 1 1 auto">
          <div style="font-size: 14px; font-weight: 600; color: #141413">Regional &amp; national rankings</div>
          <div style="font-size: 12px; color: #767d87; margin-top: 1px">Browse ranking sets, then filter down</div>
        </div>
      </button>

      <button class="row">
        <div class="radio"></div>
        <div style="flex: 1 1 auto">
          <div style="font-size: 14px; font-weight: 600; color: #141413">My saved sets</div>
          <div style="font-size: 12px; color: #767d87; margin-top: 1px">Use or edit a set</div>
        </div>
        <div class="badge" style="display: inline-block">3 saved</div>
      </button>

      <button class="row active">
        <div class="radio"><svg class="icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div style="flex: 1 1 auto">
          <div style="font-size: 14px; font-weight: 600; color: #141413">The Chase sets</div>
          <div style="font-size: 12px; color: #767d87; margin-top: 1px">Shared school-wide · switch one on, can't be edited</div>
        </div>
        <div class="badge" style="display: inline-block">2 sets</div>
      </button>

      <div class="sublist">
        <div class="subrow active">
          <div class="subradio"></div>
          <div style="font-size: 12.5px; color: #141413; flex: 1 1 auto">GCSE core benchmark</div>
          <div style="font-size: 11px; color: #9aa0a8">15 schools</div>
        </div>
        <div class="subrow">
          <div class="subradio"></div>
          <div style="font-size: 12.5px; color: #141413; flex: 1 1 auto">Post-16 sixth form peer group</div>
          <div style="font-size: 11px; color: #9aa0a8">10 schools</div>
        </div>
      </div>

      <button class="row">
        <div class="radio"></div>
        <div style="flex: 1 1 auto">
          <div style="font-size: 14px; font-weight: 600; color: #141413">Victoria Consultancy Sets</div>
          <div style="font-size: 12px; color: #767d87; margin-top: 1px">Shared with leadership, can't be edited</div>
        </div>
        <div class="badge" style="display: inline-block">1 set</div>
      </button>

    </div>

    <div style="padding: 12px 18px; border-top: 1px solid #eef0f2; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto">
      <div style="font-size: 13px; color: #5b6470">15 schools selected</div>
      <button class="btn primary">Done</button>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>

</html>

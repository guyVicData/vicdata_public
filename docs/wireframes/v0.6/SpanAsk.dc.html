<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A panel spanning two columns</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#e9eaec}
button{font-family:inherit}
.icon{display:block}
.btn{border:none;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:#141413;color:#fff}
.btn.secondary{background:#fff;color:#141413;border:1px solid #d7dae0}
.opt{display:flex;align-items:flex-start;gap:12px;border:1px solid #e3e5e9;border-radius:10px;padding:12px 14px;background:#fff}
.opt.on{border-color:#2563eb;background:#eff6ff}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #c7cbd1;flex:0 0 20px;box-sizing:border-box;margin-top:1px}
.opt.on .radio{border-color:#2563eb;background:#2563eb;box-shadow:inset 0 0 0 4px #eff6ff}
.t{font-size:13.5px;font-weight:600;color:#141413}
.s{font-size:11.5px;color:#767d87;margin-top:2px;line-height:1.4}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; position: relative; background: #e9eaec;">
  <div style="position: absolute; inset: 0; background: rgba(20,20,19,0.35)"></div>
  <div style="position: absolute; left: 12px; right: 12px; top: 150px; background: #ffffff; border-radius: 14px; box-shadow: 0 12px 32px rgba(20,20,19,0.25); display: flex; flex-direction: column; overflow: hidden">

    <div style="padding: 16px 18px 6px">
      <div style="font-size: 17px; font-weight: 600; color: #141413">This panel spans 2 columns</div>
      <div style="font-size: 12.5px; color: #767d87; margin-top: 4px; line-height: 1.45">They're set up differently. Which one should it follow?</div>
    </div>

    <div style="padding: 12px 18px; display: flex; flex-direction: column; gap: 8px">
      <div class="opt on"><span class="radio"></span><div><div class="t">Candidates <span style="font-size: 11px; color: #2563eb; font-weight: 600">&middot; left-most</span></div><div class="s">My subject &middot; no comparison</div></div></div>
      <div class="opt"><span class="radio"></span><div><div class="t">Comparisons</div><div class="s">My subject &middot; compared with 10 nearest schools</div></div></div>
      <div style="font-size: 11px; color: #9aa0a8; line-height: 1.4">Asked once. If the columns match, nothing is asked. You can override the panel later.</div>
    </div>

    <div style="padding: 12px 18px; border-top: 1px solid #eef0f2; display: flex; align-items: center; justify-content: space-between">
      <button class="btn secondary">Cancel</button>
      <button class="btn primary">Use Candidates</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

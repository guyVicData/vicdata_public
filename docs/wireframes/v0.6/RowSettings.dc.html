<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Row settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#e9eaec}
button,input{font-family:inherit}
.icon{display:block}
.btn{border:none;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:#141413;color:#fff}
.btn.ghost-danger{background:none;color:#b91c1c;padding:9px 6px}
.iconbtn{width:32px;height:32px;border-radius:50%;background:#f1f3f5;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 32px}
.label{font-size:11px;font-weight:700;color:#767d87;text-transform:uppercase;letter-spacing:0.5px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid #e3e5e9;border-radius:10px;padding:11px 14px;background:#fff}
.opt.on{border-color:#2563eb;background:#eff6ff}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #c7cbd1;flex:0 0 20px;box-sizing:border-box}
.opt.on .radio{border-color:#2563eb;background:#2563eb;box-shadow:inset 0 0 0 4px #eff6ff}
.t{font-size:13.5px;font-weight:600;color:#141413}
.s{font-size:11.5px;color:#767d87;margin-top:1px}
.struct{border:1px solid #d7dae0;border-radius:8px;padding:6px;display:flex;gap:3px;width:58px;height:26px;box-sizing:content-box;background:#fff}
.struct span{border-radius:3px;background:#c7cbd1}
.struct.on{border-color:#141413}
.struct.on span{background:#141413}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; position: relative; background: #e9eaec;">
  <div style="position: absolute; inset: 12px; background: #ffffff; border-radius: 14px; box-shadow: 0 12px 32px rgba(20,20,19,0.18); display: flex; flex-direction: column; overflow: hidden">

    <div style="padding: 16px 18px; border-bottom: 1px solid #eef0f2; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto">
      <div>
        <div style="font-size: 17px; font-weight: 600; color: #141413; letter-spacing: -0.2px">Row settings</div>
        <div style="font-size: 12px; color: #767d87; margin-top: 2px">Maths watchlist &middot; row 1 of 3</div>
      </div>
      <button class="iconbtn" aria-label="Close"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6470" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>

    <div style="flex: 1 1 auto; overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px">

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span class="label">Name</span>
        <input type="text" value="Overview" style="border: 1px solid #d7dae0; border-radius: 8px; padding: 9px 10px; font-size: 13px; color: #141413; outline: none">
      </label>

      <div class="label" style="margin-top: 4px">Time &mdash; what views in this row show</div>
      <div class="opt"><span class="radio"></span><div><div class="t">Latest year</div><div class="s">Like the Current row</div></div></div>
      <div class="opt"><span class="radio"></span><div><div class="t">Over time</div><div class="s">Like the Trends row: needs 3+ years for a trend</div></div></div>
      <div class="opt on"><span class="radio"></span><div><div class="t">Either</div><div class="s">&ldquo;Add a view&rdquo; offers both, grouped</div></div></div>

      <div class="label" style="margin-top: 4px">Panels in this row</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <div class="struct"><span style="flex: 1 1 0"></span></div>
        <div class="struct on"><span style="flex: 1 1 0"></span><span style="flex: 1 1 0"></span></div>
        <div class="struct"><span style="flex: 2 1 0"></span><span style="flex: 1 1 0"></span></div>
        <div class="struct"><span style="flex: 1 1 0"></span><span style="flex: 2 1 0"></span></div>
      </div>
      <div style="font-size: 11px; color: #9aa0a8">Options match this dashboard's 2 columns. Spans are whole panels.</div>

      <label style="display: flex; align-items: center; gap: 12px; border: 1px solid #e3e5e9; border-radius: 10px; padding: 11px 14px; margin-top: 4px">
        <span style="flex: 1 1 auto"><span class="t" style="display: block">Open when the dashboard loads</span></span>
        <span style="width: 38px; height: 22px; border-radius: 999px; background: #141413; position: relative; flex: 0 0 38px"><span style="position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff"></span></span>
      </label>
    </div>

    <div style="padding: 12px 18px; border-top: 1px solid #eef0f2; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto">
      <button class="btn ghost-danger">Delete row</button>
      <button class="btn primary">Done</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

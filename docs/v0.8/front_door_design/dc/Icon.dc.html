<script type="text/x-dc" data-dc-script data-props='{"glyph":{"editor":"enum","options":["candidates","results","context","comparisons","tiles","vbars","hbars","ranklist","line","indexed","grades","map","table","donut","podium","school","change","average","flag","arrowRight","arrowLeft","close","dashboard","library","meetings","info","check","chevronDown","external","pound","admpipeline","admfunnel","admshape","admscatter","admstrengths","admpopulation","lock","admnumbers","dumbbell"],"default":"candidates"},"size":{"editor":"int","default":24,"min":10,"max":96},"color":{"editor":"color","default":"#34d399"},"$preview":{"width":24,"height":24}}'>
class Component extends DCLogic {
  renderVals() {
    const alias = { bars: 'hbars', lines: 'indexed', rank: 'ranklist' };
    let glyph = this.props.glyph ?? 'candidates';
    glyph = alias[glyph] || glyph;
    const g = {};
    g[glyph] = true;
    const size = this.props.size ?? 24;
    return { g: g, px: size + 'px', color: this.props.color ?? 'currentColor' };
  }
}
</script>
